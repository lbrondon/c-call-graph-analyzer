[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "c-call-graph-analyzer"
version = "0.2.0"
description = "Extract every caller-callee occurrence from C projects with srcML."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lucas Rondon"}
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "source"}
py-modules = [
    "analysis_result",
    "analysis_service",
    "c_file_scanner",
    "call_occurrence",
    "config",
    "csv_call_writer",
    "exceptions",
    "main",
    "ports",
    "project",
    "project_discovery",
    "srcml_call_parser",
    "srcml_runner",
]
